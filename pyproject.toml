[project]
name = "espi-sim"
version = "0.1.0"
description = "Physically grounded simulator for Electronic Speckle Pattern Interferometry (ESPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
analysis = ["scikit-image>=0.24"]
plot = ["matplotlib>=3.9"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "scikit-image>=0.24",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/espi_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
